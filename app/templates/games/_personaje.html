{% macro cara(tipo, size=none) -%}
<svg class="cara" viewBox="0 0 80 80"{% if size %} width="{{ size }}" height="{{ size }}" style="vertical-align:-0.25em"{% endif %} aria-hidden="true" focusable="false">
{%- if tipo == 'bien' %}
  <circle cx="40" cy="40" r="34" fill="#2F8F83"/>
  <circle cx="29" cy="35" r="6" fill="#fff"/><circle cx="30" cy="36" r="3" fill="#171C1E"/>
  <circle cx="51" cy="35" r="6" fill="#fff"/><circle cx="52" cy="36" r="3" fill="#171C1E"/>
  <path d="M28 50q12 12 24 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
{%- elif tipo == 'regular' %}
  <circle cx="40" cy="40" r="34" fill="#F5C77A"/>
  <circle cx="29" cy="36" r="6" fill="#fff"/><circle cx="30" cy="37" r="3" fill="#171C1E"/>
  <circle cx="51" cy="36" r="6" fill="#fff"/><circle cx="52" cy="37" r="3" fill="#171C1E"/>
  <path d="M30 53h20" stroke="#7A5A07" stroke-width="3.5" stroke-linecap="round"/>
{%- else %}
  <circle cx="40" cy="40" r="34" fill="#E07A5F"/>
  <path d="M23 31l10 5M57 31l-10 5" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M28 55q4-5 8 0t8 0t8 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M60 14q5 8 0 11q-5-3 0-11z" fill="#9DB8D9"/>
{%- endif %}
</svg>
{%- endmacro %}
